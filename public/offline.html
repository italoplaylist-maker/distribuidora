<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · Distribuidora SaaS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7f8;
        color: #263238;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      p {
        color: #4e626d;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        background: #ef3035;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline</h1>
      <p>Não foi possível conectar ao servidor. Verifique sua internet e tente novamente. Vendas feitas offline ficam salvas neste aparelho e são enviadas automaticamente quando a conexão voltar.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
